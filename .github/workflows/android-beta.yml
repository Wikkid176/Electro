name: Build Android beta APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-beta.yml'
      - 'App.tsx'
      - 'index.ts'
      - 'src/**'
      - 'assets/**'
      - 'plugins/**'
      - 'scripts/**'
      - 'app.json'
      - 'package*.json'
      - 'metro.config.cjs'
      - 'tsconfig.json'
      - 'docs/android-toolchain.json'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.txt'

permissions:
  contents: read

concurrency:
  group: android-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: Signed standalone Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_OFFLINE: '1'
      ELL_EXPECTED_CERT_SHA256: d481be23603fd9db8676cc7121e8e6a67786ff2ae57805a2c8642a824b02d8d9
    steps:
      - name: Check out app
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Restore private beta signing
        env:
          ELL_BETA_KEYSTORE_BASE64: ${{ secrets.ELL_BETA_KEYSTORE_BASE64 }}
          ELL_BETA_STORE_PASSWORD: ${{ secrets.ELL_BETA_STORE_PASSWORD }}
          ELL_BETA_KEY_PASSWORD: ${{ secrets.ELL_BETA_KEY_PASSWORD }}
          ELL_BETA_KEY_ALIAS: ${{ secrets.ELL_BETA_KEY_ALIAS }}
        run: python3 scripts/restore-github-signing.py

      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Java 17 toolchain
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Select Java 21 for Gradle
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Register both Java toolchains
        shell: bash
        run: |
          mkdir -p "$HOME/.gradle"
          printf 'org.gradle.java.installations.paths=%s,%s\norg.gradle.java.installations.auto-download=false\n' \
            "$JAVA_HOME_17_X64" "$JAVA_HOME" >> "$HOME/.gradle/gradle.properties"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install pinned Android components
        run: sdkmanager 'platform-tools' 'platforms;android-37.0' 'build-tools;37.0.0' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Check TypeScript and unit tests
        run: |
          npm run typecheck
          npm test

      - name: Build standalone release APK
        run: npm run beta:android

      - name: Verify signing, release settings and bundled app
        run: |
          python3 scripts/verify-android-beta.py \
            --apk releases/android/ELL-0.2.0-beta.1.apk \
            --certificate-sha256 "$ELL_EXPECTED_CERT_SHA256" \
            --output-dir "$RUNNER_TEMP/apk-verification"

      - name: Prepare tester download
        run: |
          mkdir -p "$RUNNER_TEMP/ell-download"
          cp releases/android/ELL-0.2.0-beta.1.apk "$RUNNER_TEMP/ell-download/"
          cp "$RUNNER_TEMP/apk-verification/"* "$RUNNER_TEMP/ell-download/"
          cp releases/android/START-HERE.md LICENSE THIRD_PARTY_NOTICES.txt "$RUNNER_TEMP/ell-download/"
          printf '### ElectroLessonLab Android beta\nDownload **ELL-Android-beta-APK** under this run’s **Artifacts**. Unzip it and install the APK on an Android 7+ ARM phone. Signature and package checks passed; a physical-phone smoke test is still required.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK and tester instructions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ELL-Android-beta-APK
          path: ${{ runner.temp }}/ell-download/
          if-no-files-found: error
          retention-days: 14

      - name: Remove private signing files
        if: always()
        run: rm -rf "$RUNNER_TEMP/ell-signing"
